server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy the built frontend's /api calls to the backend container
    # (matches the dev-time Vite proxy in vite.config.js).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}
