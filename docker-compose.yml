version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data
    environment:
      - DB_PATH=/data/energy_grid.db
      - EIA_API_KEY=${EIA_API_KEY}

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
